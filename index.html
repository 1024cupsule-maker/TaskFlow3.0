<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TaskFlow 3.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <meta name="theme-color" content="#0F172A">
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .swipe-wrapper {
      display: flex;
      width: 200vw;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .page-view {
      width: 100vw;
      height: calc(100dvh - 88px);
      overflow-y: auto;
    }
    .tab-indicator {
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased overflow-hidden select-none">

  <!-- トップヘッダー（48px） -->
  <header class="h-12 bg-white border-b border-slate-200 px-4 flex items-center justify-between">
    <div class="flex items-center space-x-2.5">
      <div class="w-6 h-6 rounded bg-slate-900 text-white flex items-center justify-center text-[10px] font-bold tracking-widest">TF</div>
      <div class="flex items-baseline space-x-1.5">
        <h1 class="text-sm font-bold text-slate-900 tracking-tight">TaskFlow</h1>
        <span class="text-[10px] font-mono font-semibold text-slate-400">3.0</span>
      </div>
    </div>

    <div class="flex items-center space-x-2">
      <!-- 同期ステータス -->
      <div class="flex items-center space-x-1.5 text-[11px] font-medium text-slate-600 bg-slate-100 px-2.5 py-1 rounded-full border border-slate-200/80">
        <span id="syncDot" class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
        <span id="syncText">同期済み</span>
      </div>

      <!-- 設定アイコンボタン（SVGベクター） -->
      <button
        onclick="openSettingsModal()"
        title="設定"
        aria-label="設定を開く"
        class="w-8 h-8 rounded-lg border border-slate-200 bg-white hover:bg-slate-100 active:scale-95 text-slate-600 hover:text-slate-900 flex items-center justify-center transition-all"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      </button>
    </div>
  </header>

  <!-- ページ切り替えタブ（40px） -->
  <nav class="relative h-10 bg-white border-b border-slate-200 grid grid-cols-2 text-xs font-semibold">
    <button id="tabBtn0" onclick="switchPage(0)" class="flex items-center justify-center space-x-1.5 text-slate-900 transition-colors">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
      </svg>
      <span>クイック入力</span>
    </button>
    <button id="tabBtn1" onclick="switchPage(1)" class="flex items-center justify-center space-x-1.5 text-slate-400 transition-colors">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
      <span>一覧・絞り込み</span>
      <span id="totalBadge" class="ml-1 text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.2 rounded font-mono">0</span>
    </button>
    <div id="tabIndicator" class="tab-indicator absolute bottom-0 left-0 w-1/2 h-0.5 bg-slate-900"></div>
  </nav>

  <!-- スワイプコンテナ -->
  <div id="swipeWrapper" class="swipe-wrapper">

    <!-- ==================== ページ1: 入力特化 ＆ 直近8枠 ==================== -->
    <section class="page-view flex flex-col justify-between bg-slate-50">
      
      <!-- 上半分: 優先度順 2列 × 4行 = 最大8枚のカラーカード -->
      <div class="p-3.5 flex-1 flex flex-col justify-start">
        <div class="flex items-center justify-between mb-2 px-0.5">
          <span class="text-[11px] font-semibold text-slate-500 tracking-wide uppercase">直近・優先タスク（最大8件）</span>
          <span class="text-[10px] text-slate-400">期日順 / 左スワイプで全件表示</span>
        </div>

        <div id="priorityGrid" class="grid grid-cols-2 grid-rows-4 gap-2 flex-1 min-h-[260px] max-h-[340px]">
          <!-- JSで8枠を描画 -->
        </div>
      </div>

      <!-- 下半分: クイック入力フォーム -->
      <div class="bg-white border-t border-slate-200 p-4 pb-6 shadow-[0_-4px_20px_rgba(15,23,42,0.04)] rounded-t-2xl">
        <form id="quickForm" class="space-y-3 max-w-lg mx-auto">
          <div>
            <input
              type="text"
              id="quickTitle"
              placeholder="タスク内容を入力..."
              required
              autocomplete="off"
              class="w-full text-sm bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2.5 text-slate-900 placeholder-slate-400 focus:bg-white focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition-all"
            >
          </div>

          <!-- カテゴリピル（正式名称フル表示・動的生成） -->
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <span class="text-[10px] font-semibold text-slate-400 tracking-wider">カテゴリ</span>
              <button type="button" onclick="openSettingsModal()" class="text-[10px] text-slate-500 hover:text-slate-900 underline">項目を編集</button>
            </div>
            <div id="quickCatGroup" class="flex flex-wrap gap-1.5 text-[11px]">
              <!-- JSでカテゴリボタンを生成 -->
            </div>
          </div>

          <!-- 期日プリセット & カレンダー -->
          <div>
            <div class="text-[10px] font-semibold text-slate-400 mb-1.5 tracking-wider">期日指定</div>
            <div class="flex items-center space-x-1.5">
              <button type="button" onclick="setQuickDate(0)" class="q-date-btn flex-1 py-1.5 text-xs font-medium rounded-md bg-slate-100 text-slate-700 hover:bg-slate-200 transition-colors">今日</button>
              <button type="button" onclick="setQuickDate(1)" class="q-date-btn flex-1 py-1.5 text-xs font-medium rounded-md bg-slate-100 text-slate-700 hover:bg-slate-200 transition-colors">明日</button>
              <button type="button" onclick="setQuickDate(3)" class="q-date-btn flex-1 py-1.5 text-xs font-medium rounded-md bg-slate-100 text-slate-700 hover:bg-slate-200 transition-colors">3日後</button>
              <div class="relative flex-[1.3]">
                <input
                  type="date"
                  id="quickDueDate"
                  class="w-full text-xs bg-slate-50 border border-slate-300 rounded-md px-2 py-1.5 text-slate-700 focus:border-slate-900 outline-none"
                >
              </div>
            </div>
          </div>

          <!-- 登録実行ボタン -->
          <button
            type="submit"
            class="w-full bg-slate-900 hover:bg-slate-800 active:scale-[0.99] text-white font-semibold py-3 rounded-lg text-sm shadow-sm transition-all flex items-center justify-center space-x-1.5"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
            </svg>
            <span>タスクを登録</span>
          </button>
        </form>
      </div>
    </section>

    <!-- ==================== ページ2: タスク一覧 ＆ 絞り込み ==================== -->
    <section class="page-view flex flex-col bg-slate-50">
      
      <!-- フィルターエリア -->
      <div class="bg-white border-b border-slate-200 px-3.5 pt-2.5 pb-3 space-y-2.5 sticky top-0 z-10">
        <!-- 期間フィルター -->
        <div class="flex space-x-1.5 overflow-x-auto no-scrollbar text-xs">
          <button class="f-date-btn px-3 py-1 rounded-md font-semibold bg-slate-900 text-white" data-date="all">すべて</button>
          <button class="f-date-btn px-3 py-1 rounded-md font-medium bg-slate-100 text-slate-600" data-date="today">今日</button>
          <button class="f-date-btn px-3 py-1 rounded-md font-medium bg-slate-100 text-slate-600" data-date="tomorrow">明日</button>
          <button class="f-date-btn px-3 py-1 rounded-md font-medium bg-slate-100 text-slate-600" data-date="week">今週</button>
          <button class="f-date-btn px-3 py-1 rounded-md font-medium bg-slate-100 text-slate-600" data-date="month">今月</button>
        </div>

        <!-- カテゴリフィルター（動的生成） -->
        <div id="filterCatGroup" class="flex space-x-1.5 overflow-x-auto no-scrollbar text-[11px]">
          <!-- JSでフィルターボタンを生成 -->
        </div>
      </div>

      <!-- 一覧リスト -->
      <div id="fullTaskList" class="p-3.5 space-y-2 flex-1 overflow-y-auto pb-20">
        <!-- JSで全件描画 -->
      </div>

      <!-- 下部アクションバー -->
      <div class="bg-white border-t border-slate-200 px-4 py-2.5 flex items-center justify-between">
        <label class="flex items-center space-x-2 text-xs text-slate-600 cursor-pointer">
          <input type="checkbox" id="showCompletedCheck" onchange="renderAll()" class="rounded border-slate-300 text-slate-900 focus:ring-slate-900">
          <span>完了済みを表示</span>
        </label>
        <button id="shareLineBtn" class="bg-[#06C755] hover:bg-[#05b34c] text-white text-xs font-semibold px-3.5 py-1.5 rounded-md shadow-sm transition-colors flex items-center space-x-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
          </svg>
          <span>LINEで一覧を共有</span>
        </button>
      </div>
    </section>

  </div>

  <!-- ==================== 設定モーダル（カテゴリ追加・削除管理） ==================== -->
  <div id="settingsModal" class="fixed inset-0 z-50 hidden items-end sm:items-center justify-center bg-slate-900/50 backdrop-blur-[1px]">
    <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl shadow-2xl border border-slate-200 overflow-hidden flex flex-col max-h-[85dvh]">
      
      <!-- モーダルヘッダー -->
      <div class="px-4 py-3.5 border-b border-slate-200 flex items-center justify-between bg-slate-50/70">
        <div class="flex items-center space-x-2">
          <svg class="w-4 h-4 text-slate-700" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          <h2 class="text-sm font-bold text-slate-900">アプリケーション設定</h2>
        </div>
        <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-slate-800 p-1 rounded-md">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- モーダル本体 -->
      <div class="p-4 overflow-y-auto space-y-5">
        
        <!-- 新規カテゴリ追加フォーム -->
        <div>
          <h3 class="text-xs font-bold text-slate-700 mb-2">タスク項目の種類を追加</h3>
          <form id="addCategoryForm" class="space-y-2.5 bg-slate-50 p-3 rounded-xl border border-slate-200/80">
            <div class="flex space-x-2">
              <input
                type="text"
                id="newCatLabel"
                placeholder="項目名（例: 学習・読書、買い物）"
                maxlength="14"
                required
                class="flex-1 text-xs bg-white border border-slate-300 rounded-lg px-3 py-2 text-slate-900 placeholder-slate-400 focus:border-slate-900 outline-none"
              >
              <button
                type="submit"
                class="bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold px-3.5 py-2 rounded-lg shrink-0 transition-colors"
              >
                追加
              </button>
            </div>
            <!-- カラー選択 -->
            <div class="flex items-center justify-between pt-1">
              <span class="text-[10px] font-medium text-slate-500">ラベルカラー</span>
              <div id="colorPickerGroup" class="flex space-x-2">
                <!-- JSでカラー選択ボタンを生成 -->
              </div>
            </div>
          </form>
        </div>

        <!-- 登録済みカテゴリ一覧（削除可能） -->
        <div>
          <div class="flex items-center justify-between mb-2">
            <h3 class="text-xs font-bold text-slate-700">現在のタスク項目一覧</h3>
            <button type="button" onclick="resetDefaultCategories()" class="text-[10px] text-slate-400 hover:text-slate-700 underline">
              初期設定に戻す
            </button>
          </div>
          <div id="settingsCategoryList" class="space-y-1.5">
            <!-- JSで一覧描画 -->
          </div>
        </div>

      </div>

      <!-- モーダルフッター -->
      <div class="px-4 py-3 border-t border-slate-200 bg-slate-50 flex justify-end">
        <button onclick="closeSettingsModal()" class="bg-slate-900 text-white text-xs font-semibold px-5 py-2 rounded-lg hover:bg-slate-800 transition-colors">
          完了
        </button>
      </div>
    </div>
  </div>

  <!-- トースト通知 -->
  <div id="toast" class="fixed top-14 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white text-xs font-medium px-4 py-2 rounded-md shadow-lg opacity-0 pointer-events-none transition-opacity duration-200">
    完了しました
  </div>

  <script>
    const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycby3qmDEvkXcEFCTtmLjyWNVuO3j-BhD9DmIW2E680l4CZosTQMianATfxUI2A4ldQ0Xew/exec";

    // カラーパレット定義（マスターガイド準拠・落ち着いたトーン）
    const COLOR_THEMES = {
      blue: {
        name: "ブルー",
        swatch: "bg-blue-600",
        cardBg: "bg-blue-50/70 border-blue-200/90",
        accentBar: "bg-blue-600",
        badge: "bg-blue-100 text-blue-800",
        btnActive: "bg-blue-600 text-white border-blue-600"
      },
      emerald: {
        name: "エメラルド",
        swatch: "bg-emerald-600",
        cardBg: "bg-emerald-50/70 border-emerald-200/90",
        accentBar: "bg-emerald-600",
        badge: "bg-emerald-100 text-emerald-800",
        btnActive: "bg-emerald-600 text-white border-emerald-600"
      },
      amber: {
        name: "アンバー",
        swatch: "bg-amber-500",
        cardBg: "bg-amber-50/70 border-amber-200/90",
        accentBar: "bg-amber-500",
        badge: "bg-amber-100 text-amber-800",
        btnActive: "bg-amber-500 text-white border-amber-500"
      },
      indigo: {
        name: "インディゴ",
        swatch: "bg-indigo-600",
        cardBg: "bg-indigo-50/70 border-indigo-200/90",
        accentBar: "bg-indigo-600",
        badge: "bg-indigo-100 text-indigo-800",
        btnActive: "bg-indigo-600 text-white border-indigo-600"
      },
      rose: {
        name: "ローズ",
        swatch: "bg-rose-600",
        cardBg: "bg-rose-50/70 border-rose-200/90",
        accentBar: "bg-rose-600",
        badge: "bg-rose-100 text-rose-800",
        btnActive: "bg-rose-600 text-white border-rose-600"
      },
      slate: {
        name: "スレート",
        swatch: "bg-slate-600",
        cardBg: "bg-slate-100/90 border-slate-300/90",
        accentBar: "bg-slate-600",
        badge: "bg-slate-200 text-slate-700",
        btnActive: "bg-slate-700 text-white border-slate-700"
      }
    };

    // デフォルトカテゴリ（正式名称5項目に統一）
    const DEFAULT_CATEGORIES = [
      { id: "work_task", label: "仕事タスク", color: "blue" },
      { id: "life_task", label: "生活タスク", color: "emerald" },
      { id: "work_knowledge", label: "仕事ナレッジ", color: "indigo" },
      { id: "home_knowledge", label: "家庭ナレッジ", color: "amber" },
      { id: "yomoyama", label: "よもやま", color: "slate" }
    ];

    // カテゴリ読み込み（旧短縮名のまま保存されていた場合は正式名称へ自動マイグレーション）
    let categories = JSON.parse(localStorage.getItem('taskflow_categories_v3') || 'null');
    if (!Array.isArray(categories) || categories.length === 0) {
      categories = JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
      localStorage.setItem('taskflow_categories_v3', JSON.stringify(categories));
    }

    function saveCategories() {
      localStorage.setItem('taskflow_categories_v3', JSON.stringify(categories));
      if (!categories.some(c => c.id === selectedQuickCat)) {
        selectedQuickCat = categories[0].id;
      }
      if (filterCat !== 'all' && !categories.some(c => c.id === filterCat)) {
        filterCat = 'all';
      }
      renderCategoryControls();
      renderSettingsCategoryList();
      renderAll();
    }

    function getCategoryInfo(catId) {
      const found = categories.find(c => c.id === catId);
      if (found) {
        return {
          label: found.label,
          theme: COLOR_THEMES[found.color] || COLOR_THEMES.slate
        };
      }
      return {
        label: catId || "未分類",
        theme: COLOR_THEMES.slate
      };
    }

    // タスクデータ初期化
    let tasks = JSON.parse(localStorage.getItem('taskflow_tasks') || '[]');
    if (tasks.length === 0) {
      const today = getDateOffsetString(0);
      const tomorrow = getDateOffsetString(1);
      const day3 = getDateOffsetString(3);
      tasks = [
        { id: 't1', title: '週次定例のアジェンダ作成', category: 'work_task', dueDate: today, completed: false, createdAt: today },
        { id: 't2', title: '洗剤とキッチンペーパー購入', category: 'life_task', dueDate: today, completed: false, createdAt: today },
        { id: 't3', title: 'クライアント見積書の最終確認', category: 'work_task', dueDate: tomorrow, completed: false, createdAt: today },
        { id: 't4', title: 'GAS連携仕様のメモ整理', category: 'work_knowledge', dueDate: day3, completed: false, createdAt: today },
        { id: 't5', title: 'エアコンフィルターの掃除', category: 'home_knowledge', dueDate: day3, completed: false, createdAt: today }
      ];
      localStorage.setItem('taskflow_tasks', JSON.stringify(tasks));
    }

    let currentPage = 0;
    let selectedQuickCat = categories[0].id;
    let selectedNewCatColor = 'blue';
    let filterDate = 'all';
    let filterCat = 'all';
    let syncTimeout = null;

    function getDateOffsetString(offsetDays) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function formatShortDate(dateStr) {
      if (!dateStr) return '期限なし';
      const today = getDateOffsetString(0);
      const tomorrow = getDateOffsetString(1);
      if (dateStr < today) return '期限超過';
      if (dateStr === today) return '本日';
      if (dateStr === tomorrow) return '明日';
      const parts = dateStr.split('-');
      return `${Number(parts[1])}/${Number(parts[2])}`;
    }

    // ページ切り替え
    window.switchPage = function(pageIndex) {
      currentPage = pageIndex;
      const wrapper = document.getElementById('swipeWrapper');
      const indicator = document.getElementById('tabIndicator');
      const btn0 = document.getElementById('tabBtn0');
      const btn1 = document.getElementById('tabBtn1');

      wrapper.style.transform = `translateX(-${pageIndex * 100}vw)`;
      indicator.style.transform = `translateX(${pageIndex * 100}%)`;

      if (pageIndex === 0) {
        btn0.classList.replace('text-slate-400', 'text-slate-900');
        btn1.classList.replace('text-slate-900', 'text-slate-400');
      } else {
        btn1.classList.replace('text-slate-400', 'text-slate-900');
        btn0.classList.replace('text-slate-900', 'text-slate-400');
      }
    };

    // スワイプジェスチャー判定
    let touchStartX = 0;
    let touchStartY = 0;
    document.addEventListener('touchstart', e => {
      if (!document.getElementById('settingsModal').classList.contains('hidden')) return;
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    document.addEventListener('touchend', e => {
      if (!document.getElementById('settingsModal').classList.contains('hidden')) return;
      const dx = e.changedTouches[0].screenX - touchStartX;
      const dy = e.changedTouches[0].screenY - touchStartY;
      if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) {
        if (dx < 0 && currentPage === 0) switchPage(1);
        if (dx > 0 && currentPage === 1) switchPage(0);
      }
    }, { passive: true });

    // カテゴリ選択UI・フィルターUIの動的生成
    function renderCategoryControls() {
      const quickGroup = document.getElementById('quickCatGroup');
      quickGroup.innerHTML = categories.map(cat => {
        const isSelected = cat.id === selectedQuickCat;
        const theme = COLOR_THEMES[cat.color] || COLOR_THEMES.slate;
        const btnClass = isSelected
          ? `px-3 py-1.5 rounded-md font-semibold border transition-all ${theme.btnActive}`
          : `px-3 py-1.5 rounded-md font-medium bg-slate-50 text-slate-600 border border-slate-200 hover:bg-slate-100 transition-all`;
        return `<button type="button" onclick="selectQuickCategory('${cat.id}')" class="${btnClass}">${escapeHtml(cat.label)}</button>`;
      }).join('');

      const filterGroup = document.getElementById('filterCatGroup');
      const allActive = filterCat === 'all';
      let filterHtml = `
        <button onclick="selectFilterCategory('all')" class="px-2.5 py-1 rounded-md shrink-0 ${allActive ? 'font-semibold bg-slate-700 text-white' : 'font-medium bg-slate-100 text-slate-600'}">
          全カテゴリ
        </button>
      `;
      filterHtml += categories.map(cat => {
        const active = filterCat === cat.id;
        return `
          <button onclick="selectFilterCategory('${cat.id}')" class="px-2.5 py-1 rounded-md shrink-0 ${active ? 'font-semibold bg-slate-700 text-white' : 'font-medium bg-slate-100 text-slate-600'}">
            ${escapeHtml(cat.label)}
          </button>
        `;
      }).join('');
      filterGroup.innerHTML = filterHtml;
    }

    window.selectQuickCategory = function(catId) {
      selectedQuickCat = catId;
      renderCategoryControls();
    };

    window.selectFilterCategory = function(catId) {
      filterCat = catId;
      renderCategoryControls();
      renderFullList();
    };

    // 設定モーダル制御
    window.openSettingsModal = function() {
      renderColorPicker();
      renderSettingsCategoryList();
      const modal = document.getElementById('settingsModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    };

    window.closeSettingsModal = function() {
      const modal = document.getElementById('settingsModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    };

    function renderColorPicker() {
      const container = document.getElementById('colorPickerGroup');
      container.innerHTML = Object.keys(COLOR_THEMES).map(key => {
        const theme = COLOR_THEMES[key];
        const isSelected = key === selectedNewCatColor;
        return `
          <button
            type="button"
            onclick="selectNewCatColor('${key}')"
            title="${theme.name}"
            class="w-5 h-5 rounded-full ${theme.swatch} ${isSelected ? 'ring-2 ring-offset-2 ring-slate-900 scale-110' : 'opacity-70 hover:opacity-100'} transition-all"
          ></button>
        `;
      }).join('');
    }

    window.selectNewCatColor = function(colorKey) {
      selectedNewCatColor = colorKey;
      renderColorPicker();
    };

    function renderSettingsCategoryList() {
      const list = document.getElementById('settingsCategoryList');
      list.innerHTML = categories.map(cat => {
        const theme = COLOR_THEMES[cat.color] || COLOR_THEMES.slate;
        const canDelete = categories.length > 1;
        return `
          <div class="flex items-center justify-between px-3 py-2 bg-white border border-slate-200 rounded-lg">
            <div class="flex items-center space-x-2.5">
              <span class="w-2.5 h-2.5 rounded-full ${theme.swatch}"></span>
              <span class="text-xs font-semibold text-slate-800">${escapeHtml(cat.label)}</span>
            </div>
            ${canDelete ? `
              <button
                type="button"
                onclick="deleteCategory('${cat.id}')"
                title="項目を削除"
                class="text-slate-400 hover:text-rose-600 p-1 rounded transition-colors flex items-center space-x-1 text-[11px]"
              >
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
                <span>削除</span>
              </button>
            ` : `<span class="text-[10px] text-slate-400">必須</span>`}
          </div>
        `;
      }).join('');
    }

    document.getElementById('addCategoryForm').addEventListener('submit', e => {
      e.preventDefault();
      const input = document.getElementById('newCatLabel');
      const label = input.value.trim();
      if (!label) return;

      if (categories.some(c => c.label === label)) {
        showToast('同じ名前の項目が既にあります');
        return;
      }

      const newId = 'cat_' + Date.now();
      categories.push({
        id: newId,
        label: label,
        color: selectedNewCatColor
      });
      input.value = '';
      saveCategories();
      showToast('タスク項目を追加しました');
    });

    window.deleteCategory = function(catId) {
      if (categories.length <= 1) return;
      categories = categories.filter(c => c.id !== catId);
      const fallbackId = categories[0].id;
      tasks.forEach(t => {
        if (t.category === catId) t.category = fallbackId;
      });
      saveCategories();
      saveAndSync('タスク項目を削除しました');
    };

    window.resetDefaultCategories = function() {
      categories = JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
      saveCategories();
      showToast('項目を初期設定に戻しました');
    };

    // 優先度ソート（終了日が近い順 かつ 作成日が新しい順）
    function getTop8PriorityTasks() {
      const active = tasks.filter(t => !t.completed);
      return active.sort((a, b) => {
        const dueA = a.dueDate || '9999-12-31';
        const dueB = b.dueDate || '9999-12-31';
        if (dueA !== dueB) return dueA.localeCompare(dueB);
        return (b.id || '').localeCompare(a.id || '');
      }).slice(0, 8);
    }

    function renderPriorityGrid() {
      const grid = document.getElementById('priorityGrid');
      const top8 = getTop8PriorityTasks();
      const today = getDateOffsetString(0);
      let html = '';

      for (let i = 0; i < 8; i++) {
        const task = top8[i];
        if (task) {
          const catInfo = getCategoryInfo(task.category);
          const style = catInfo.theme;
          const dateLabel = formatShortDate(task.dueDate);
          const isUrgent = task.dueDate && task.dueDate <= today;
          html += `
            <div class="relative overflow-hidden flex items-center justify-between px-2.5 py-1.5 rounded-lg border ${style.cardBg} shadow-[0_1px_2px_rgba(0,0,0,0.03)] transition-all">
              <div class="absolute left-0 top-0 bottom-0 w-1 ${style.accentBar}"></div>
              <div class="min-w-0 flex-1 pl-1 pr-1.5">
                <div class="text-xs font-semibold text-slate-800 truncate leading-snug">${escapeHtml(task.title)}</div>
                <div class="flex items-center space-x-1.5 mt-0.5">
                  <span class="text-[9px] font-bold px-1.5 py-0.2 rounded ${isUrgent ? 'bg-rose-600 text-white' : style.badge}">
                    ${dateLabel}
                  </span>
                  <span class="text-[9px] text-slate-500 truncate">${escapeHtml(catInfo.label)}</span>
                </div>
              </div>
              <button
                onclick="toggleComplete('${task.id}')"
                title="完了にする"
                class="w-6 h-6 rounded border border-slate-300 bg-white/90 hover:border-slate-900 hover:bg-slate-900 hover:text-white text-slate-400 flex items-center justify-center shrink-0 transition-colors"
              >
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>
              </button>
            </div>
          `;
        } else {
          html += `
            <div class="flex items-center justify-center rounded-lg border border-dashed border-slate-200 bg-white/40 text-[10px] text-slate-300 font-mono">
              EMPTY
            </div>
          `;
        }
      }
      grid.innerHTML = html;
    }

    function renderFullList() {
      const listEl = document.getElementById('fullTaskList');
      const showCompleted = document.getElementById('showCompletedCheck').checked;
      const today = getDateOffsetString(0);
      const tomorrow = getDateOffsetString(1);

      const filtered = tasks.filter(t => {
        if (!showCompleted && t.completed) return false;
        if (filterCat !== 'all' && t.category !== filterCat) return false;
        if (filterDate === 'today') return t.dueDate === today;
        if (filterDate === 'tomorrow') return t.dueDate === tomorrow;
        if (filterDate === 'week') {
          if (!t.dueDate) return false;
          const target = new Date(t.dueDate);
          const now = new Date();
          now.setHours(0, 0, 0, 0);
          const nextWeek = new Date(now);
          nextWeek.setDate(now.getDate() + 7);
          return target >= now && target <= nextWeek;
        }
        if (filterDate === 'month') {
          return t.dueDate && t.dueDate.slice(0, 7) === today.slice(0, 7);
        }
        return true;
      }).sort((a, b) => {
        if (a.completed !== b.completed) return a.completed ? 1 : -1;
        return (a.dueDate || '9999-12-31').localeCompare(b.dueDate || '9999-12-31');
      });

      document.getElementById('totalBadge').textContent = tasks.filter(t => !t.completed).length;

      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="text-center py-16 text-xs text-slate-400">該当するタスクはありません</div>`;
        return;
      }

      listEl.innerHTML = filtered.map(task => {
        const catInfo = getCategoryInfo(task.category);
        const style = catInfo.theme;
        return `
          <div class="relative overflow-hidden flex items-center justify-between p-3 bg-white rounded-lg border border-slate-200 shadow-sm ${task.completed ? 'opacity-50 bg-slate-50' : ''}">
            <div class="absolute left-0 top-0 bottom-0 w-1 ${style.accentBar}"></div>
            <div class="flex items-center space-x-3 flex-1 min-w-0 pl-1.5 pr-2">
              <input
                type="checkbox"
                ${task.completed ? 'checked' : ''}
                onchange="toggleComplete('${task.id}')"
                class="w-4 h-4 rounded border-slate-300 text-slate-900 focus:ring-slate-900 cursor-pointer"
              >
              <div class="min-w-0 flex-1">
                <div class="text-sm font-medium ${task.completed ? 'line-through text-slate-400' : 'text-slate-800'} truncate">
                  ${escapeHtml(task.title)}
                </div>
                <div class="flex items-center space-x-2 mt-1 text-[10px]">
                  <span class="px-1.5 py-0.5 rounded font-semibold ${style.badge}">${escapeHtml(catInfo.label)}</span>
                  ${task.dueDate ? `<span class="text-slate-500 font-mono">期日: ${task.dueDate}</span>` : ''}
                </div>
              </div>
            </div>
            <button onclick="deleteTask('${task.id}')" class="text-slate-400 hover:text-rose-600 p-1.5 transition-colors" title="削除">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          </div>
        `;
      }).join('');
    }

    function renderAll() {
      renderPriorityGrid();
      renderFullList();
    }

    function saveAndSync(toastMsg) {
      localStorage.setItem('taskflow_tasks', JSON.stringify(tasks));
      renderAll();
      if (toastMsg) showToast(toastMsg);

      if (syncTimeout) clearTimeout(syncTimeout);
      const dot = document.getElementById('syncDot');
      const txt = document.getElementById('syncText');
      dot.className = 'w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse';
      txt.textContent = '同期中...';

      const payloadTasks = tasks.map(t => ({
        ...t,
        categoryLabel: getCategoryInfo(t.category).label
      }));

      syncTimeout = setTimeout(() => {
        fetch(GAS_WEBAPP_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'syncAll', tasks: payloadTasks })
        }).then(() => {
          dot.className = 'w-1.5 h-1.5 rounded-full bg-emerald-500';
          txt.textContent = '同期済み';
        }).catch(() => {
          dot.className = 'w-1.5 h-1.5 rounded-full bg-rose-500';
          txt.textContent = '同期エラー';
        });
      }, 600);
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('opacity-0');
      setTimeout(() => el.classList.add('opacity-0'), 1500);
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }

    window.toggleComplete = function(id) {
      const t = tasks.find(item => item.id === id);
      if (t) {
        t.completed = !t.completed;
        saveAndSync(t.completed ? 'タスクを完了にしました' : '未完了に戻しました');
      }
    };

    window.deleteTask = function(id) {
      tasks = tasks.filter(item => item.id !== id);
      saveAndSync('タスクを削除しました');
    };

    // クイック期日セット
    window.setQuickDate = function(offsetDays) {
      document.getElementById('quickDueDate').value = getDateOffsetString(offsetDays);
    };

    // 新規登録フォーム送信
    document.getElementById('quickForm').addEventListener('submit', e => {
      e.preventDefault();
      const titleInput = document.getElementById('quickTitle');
      const dueInput = document.getElementById('quickDueDate');
      const title = titleInput.value.trim();
      if (!title) return;

      tasks.unshift({
        id: 'task_' + Date.now(),
        title: title,
        category: selectedQuickCat,
        dueDate: dueInput.value || getDateOffsetString(0),
        completed: false,
        createdAt: getDateOffsetString(0)
      });

      titleInput.value = '';
      saveAndSync('タスクを登録しました');
    });

    // 一覧ページの期間フィルター制御
    document.querySelectorAll('.f-date-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.f-date-btn').forEach(b => {
          b.className = 'f-date-btn px-3 py-1 rounded-md font-medium bg-slate-100 text-slate-600';
        });
        btn.className = 'f-date-btn px-3 py-1 rounded-md font-semibold bg-slate-900 text-white';
        filterDate = btn.dataset.date;
        renderFullList();
      });
    });

    // LINE共有ボタン（絵文字なしフォーマット）
    document.getElementById('shareLineBtn').addEventListener('click', () => {
      const active = tasks.filter(t => !t.completed);
      if (active.length === 0) {
        showToast('未完了のタスクはありません');
        return;
      }
      let msg = '【TaskFlow 3.0 タスク一覧】\n';
      active.forEach(t => {
        const cat = getCategoryInfo(t.category).label;
        msg += `・[${cat}] ${t.title}${t.dueDate ? ` (${t.dueDate})` : ''}\n`;
      });
      window.open(`https://line.me/R/msg/text/?${encodeURIComponent(msg.trim())}`, '_blank');
    });

    // 初期描画
    document.getElementById('quickDueDate').value = getDateOffsetString(0);
    renderCategoryControls();
    renderAll();
  </script>
</body>
</html>
