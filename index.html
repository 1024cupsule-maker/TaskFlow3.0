<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TaskFlow 3.1</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <meta name="theme-color" content="#020617">
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background-color: #020617;
      color: #f1f5f9;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .swipe-wrapper {
      display: flex;
      width: 200vw;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .page-view {
      width: 100vw;
      height: calc(100dvh - 88px);
      overflow-y: auto;
    }
    .tab-indicator {
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1) opacity(0.7);
      cursor: pointer;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased overflow-hidden select-none">

  <!-- トップヘッダー（48px） -->
  <header class="h-12 bg-slate-900 border-b border-slate-800 px-4 flex items-center justify-between">
    <div class="flex items-center space-x-2.5">
      <div class="w-6 h-6 rounded bg-slate-100 text-slate-950 flex items-center justify-center text-[10px] font-bold tracking-widest">TF</div>
      <div class="flex items-baseline space-x-1.5">
        <h1 class="text-sm font-bold text-slate-100 tracking-tight">TaskFlow</h1>
        <span class="text-[10px] font-mono font-semibold text-slate-400">3.1</span>
      </div>
    </div>

    <div class="flex items-center space-x-2">
      <!-- 同期ステータス -->
      <div class="flex items-center space-x-1.5 text-[11px] font-medium text-slate-300 bg-slate-800/90 px-2.5 py-1 rounded-full border border-slate-700/80">
        <span id="syncDot" class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
        <span id="syncText">同期済み</span>
      </div>

      <!-- 設定アイコンボタン（SVGベクター） -->
      <button
        onclick="openSettingsModal()"
        title="設定"
        aria-label="設定を開く"
        class="w-8 h-8 rounded-lg border border-slate-700 bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 hover:text-white flex items-center justify-center transition-all"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      </button>
    </div>
  </header>

  <!-- ページ切り替えタブ（40px） -->
  <nav class="relative h-10 bg-slate-900 border-b border-slate-800 grid grid-cols-2 text-xs font-semibold">
    <button id="tabBtn0" onclick="switchPage(0)" class="flex items-center justify-center space-x-1.5 text-slate-100 transition-colors">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
      </svg>
      <span>クイック入力</span>
    </button>
    <button id="tabBtn1" onclick="switchPage(1)" class="flex items-center justify-center space-x-1.5 text-slate-500 transition-colors">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
      <span>一覧・検索</span>
      <span id="totalBadge" class="ml-1 text-[10px] bg-slate-800 text-slate-300 border border-slate-700 px-1.5 py-0.2 rounded font-mono">0</span>
    </button>
    <div id="tabIndicator" class="tab-indicator absolute bottom-0 left-0 w-1/2 h-0.5 bg-slate-100"></div>
  </nav>

  <!-- スワイプコンテナ -->
  <div id="swipeWrapper" class="swipe-wrapper">

    <!-- ==================== ページ1: 入力特化 ＆ 直近8枠 ==================== -->
    <section class="page-view flex flex-col justify-between bg-slate-950">
      
      <!-- 上半分: 優先度順 2列 × 4行 = 最大8枚のカラーカード -->
      <div class="p-3.5 flex-1 flex flex-col justify-start">
        <div class="flex items-center justify-between mb-2 px-0.5">
          <span class="text-[11px] font-semibold text-slate-400 tracking-wide uppercase">直近・優先タスク（最大8件）</span>
          <span class="text-[10px] text-slate-500">期日順 / 左スワイプで全件・検索</span>
        </div>

        <div id="priorityGrid" class="grid grid-cols-2 grid-rows-4 gap-2 flex-1 min-h-[250px] max-h-[330px]"></div>
      </div>

      <!-- 下半分: クイック入力フォーム -->
      <div class="bg-slate-900 border-t border-slate-800 p-4 pb-6 shadow-[0_-8px_24px_rgba(0,0,0,0.45)] rounded-t-2xl">
        <form id="quickForm" class="space-y-3 max-w-lg mx-auto">
          <div>
            <input
              type="text"
              id="quickTitle"
              placeholder="タスクまたはナレッジのタイトルを入力..."
              required
              autocomplete="off"
              class="w-full text-sm bg-slate-950 border border-slate-700 rounded-lg px-3.5 py-2.5 text-slate-100 placeholder-slate-500 focus:border-slate-300 focus:ring-1 focus:ring-slate-300 outline-none transition-all"
            >
          </div>

          <!-- カテゴリピル（正式名称フル表示・動的生成） -->
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <span class="text-[10px] font-semibold text-slate-400 tracking-wider">カテゴリ</span>
              <button type="button" onclick="openSettingsModal('categories')" class="text-[10px] text-slate-400 hover:text-slate-200 underline">項目を編集</button>
            </div>
            <div id="quickCatGroup" class="flex flex-wrap gap-1.5 text-[11px]"></div>
          </div>

          <!-- 期日指定 & ルーティン設定 -->
          <div class="grid grid-cols-1 gap-2.5">
            <div>
              <div class="text-[10px] font-semibold text-slate-400 mb-1.5 tracking-wider">期日指定</div>
              <div class="flex items-center space-x-1.5">
                <button type="button" onclick="setQuickDate(0)" class="flex-1 py-1.5 text-xs font-medium rounded-md bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700 transition-colors">今日</button>
                <button type="button" onclick="setQuickDate(1)" class="flex-1 py-1.5 text-xs font-medium rounded-md bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700 transition-colors">明日</button>
                <button type="button" onclick="setQuickDate(3)" class="flex-1 py-1.5 text-xs font-medium rounded-md bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700 transition-colors">3日後</button>
                <div class="relative flex-[1.35]">
                  <input
                    type="date"
                    id="quickDueDate"
                    class="w-full text-xs bg-slate-950 border border-slate-700 rounded-md px-2 py-1.5 text-slate-200 focus:border-slate-300 outline-none"
                  >
                </div>
              </div>
            </div>

            <!-- ルーティン（繰り返し）選択 -->
            <div>
              <div class="text-[10px] font-semibold text-slate-400 mb-1.5 tracking-wider">繰り返し（ルーティン）</div>
              <div id="quickRepeatGroup" class="grid grid-cols-4 gap-1.5 text-[11px]">
                <button type="button" data-repeat="none" onclick="selectQuickRepeat('none')" class="q-rep-btn py-1.5 rounded-md font-semibold bg-slate-100 text-slate-950 border border-slate-100 transition-all">なし</button>
                <button type="button" data-repeat="daily" onclick="selectQuickRepeat('daily')" class="q-rep-btn py-1.5 rounded-md font-medium bg-slate-800/80 text-slate-400 border border-slate-700/80 hover:text-slate-200 transition-all">毎日</button>
                <button type="button" data-repeat="weekly" onclick="selectQuickRepeat('weekly')" class="q-rep-btn py-1.5 rounded-md font-medium bg-slate-800/80 text-slate-400 border border-slate-700/80 hover:text-slate-200 transition-all">毎週</button>
                <button type="button" data-repeat="monthly" onclick="selectQuickRepeat('monthly')" class="q-rep-btn py-1.5 rounded-md font-medium bg-slate-800/80 text-slate-400 border border-slate-700/80 hover:text-slate-200 transition-all">毎月</button>
              </div>
            </div>
          </div>

          <!-- ナレッジ詳細メモ・URL添付トグル -->
          <div>
            <button
              type="button"
              id="toggleDetailsBtn"
              onclick="toggleQuickDetails()"
              class="flex items-center space-x-1.5 text-[11px] font-medium text-slate-400 hover:text-slate-200 transition-colors"
            >
              <svg id="toggleDetailsIcon" class="w-3.5 h-3.5 transition-transform" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
              </svg>
              <span>詳細メモ・URLリンクを追加</span>
            </button>

            <div id="quickDetailsPanel" class="hidden mt-2 space-y-2 p-2.5 bg-slate-950/90 rounded-lg border border-slate-800">
              <textarea
                id="quickMemo"
                rows="2"
                placeholder="補足メモ・手順・ナレッジ内容..."
                class="w-full text-xs bg-slate-900 border border-slate-700 rounded-md px-2.5 py-2 text-slate-200 placeholder-slate-500 focus:border-slate-400 outline-none resize-none"
              ></textarea>
              <div class="relative flex items-center">
                <svg class="w-3.5 h-3.5 text-slate-500 absolute left-2.5 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
                </svg>
                <input
                  type="url"
                  id="quickUrl"
                  placeholder="https://...（参考URL）"
                  class="w-full text-xs bg-slate-900 border border-slate-700 rounded-md pl-8 pr-2.5 py-1.5 text-slate-200 placeholder-slate-500 focus:border-slate-400 outline-none font-mono"
                >
              </div>
            </div>
          </div>

          <!-- 登録実行ボタン -->
          <button
            type="submit"
            class="w-full bg-slate-100 hover:bg-white active:scale-[0.99] text-slate-950 font-bold py-3 rounded-lg text-sm shadow-sm transition-all flex items-center justify-center space-x-1.5"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
            </svg>
            <span>タスクを登録</span>
          </button>
        </form>
      </div>
    </section>

    <!-- ==================== ページ2: タスク一覧 ＆ 検索・絞り込み ==================== -->
    <section class="page-view flex flex-col bg-slate-950">
      
      <!-- 検索 & フィルターエリア -->
      <div class="bg-slate-900 border-b border-slate-800 px-3.5 pt-2.5 pb-3 space-y-2.5 sticky top-0 z-10">
        
        <!-- リアルタイムキーワード検索バー -->
        <div class="relative flex items-center">
          <svg class="w-3.5 h-3.5 text-slate-400 absolute left-3 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <input
            type="text"
            id="searchKeywordInput"
            oninput="handleSearchInput()"
            placeholder="タイトル・詳細メモ・URLを検索..."
            class="w-full text-xs bg-slate-950 border border-slate-700 rounded-lg pl-8 pr-8 py-2 text-slate-100 placeholder-slate-500 focus:border-slate-400 outline-none transition-colors"
          >
          <button
            type="button"
            id="clearSearchBtn"
            onclick="clearSearchKeyword()"
            class="hidden absolute right-2.5 text-slate-400 hover:text-slate-200 p-0.5"
            title="検索をクリア"
          >
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <!-- 期間フィルター -->
        <div class="flex space-x-1.5 overflow-x-auto no-scrollbar text-xs">
          <button class="f-date-btn px-3 py-1 rounded-md font-semibold bg-slate-100 text-slate-950" data-date="all">すべて</button>
          <button class="f-date-btn px-3 py-1 rounded-md font-medium bg-slate-800 text-slate-400" data-date="today">今日</button>
          <button class="f-date-btn px-3 py-1 rounded-md font-medium bg-slate-800 text-slate-400" data-date="tomorrow">明日</button>
          <button class="f-date-btn px-3 py-1 rounded-md font-medium bg-slate-800 text-slate-400" data-date="week">今週</button>
          <button class="f-date-btn px-3 py-1 rounded-md font-medium bg-slate-800 text-slate-400" data-date="month">今月</button>
        </div>

        <!-- カテゴリフィルター（動的生成） -->
        <div id="filterCatGroup" class="flex space-x-1.5 overflow-x-auto no-scrollbar text-[11px]"></div>
      </div>

      <!-- 一覧リスト -->
      <div id="fullTaskList" class="p-3.5 space-y-2 flex-1 overflow-y-auto pb-20"></div>

      <!-- 下部アクションバー -->
      <div class="bg-slate-900 border-t border-slate-800 px-4 py-2.5 flex items-center justify-between">
        <label class="flex items-center space-x-2 text-xs text-slate-400 cursor-pointer">
          <input type="checkbox" id="showCompletedCheck" onchange="renderAll()" class="rounded border-slate-600 bg-slate-800 text-slate-100 focus:ring-slate-400">
          <span>完了済みを表示</span>
        </label>
        <button id="shareLineBtn" class="bg-[#06C755] hover:bg-[#05b34c] text-white text-xs font-semibold px-3.5 py-1.5 rounded-md shadow-sm transition-colors flex items-center space-x-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
          </svg>
          <span>LINEで一覧を共有</span>
        </button>
      </div>
    </section>

  </div>

  <!-- ==================== 設定モーダル（通知設定 & カテゴリ管理） ==================== -->
  <div id="settingsModal" class="fixed inset-0 z-50 hidden items-end sm:items-center justify-center bg-black/70 backdrop-blur-[2px]">
    <div class="bg-slate-900 w-full max-w-md rounded-t-2xl sm:rounded-2xl shadow-2xl border border-slate-800 overflow-hidden flex flex-col max-h-[88dvh]">
      
      <!-- モーダルヘッダー -->
      <div class="px-4 py-3.5 border-b border-slate-800 flex items-center justify-between bg-slate-950/60">
        <div class="flex items-center space-x-2">
          <svg class="w-4 h-4 text-slate-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          <h2 class="text-sm font-bold text-slate-100">アプリケーション設定</h2>
        </div>
        <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-white p-1 rounded-md">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- 設定タブ切り替え -->
      <div class="grid grid-cols-2 border-b border-slate-800 text-xs font-semibold bg-slate-900">
        <button id="setTabNotify" onclick="switchSettingsTab('notify')" class="py-2.5 border-b-2 border-slate-100 text-slate-100 flex items-center justify-center space-x-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
          </svg>
          <span>通知</span>
        </button>
        <button id="setTabCategories" onclick="switchSettingsTab('categories')" class="py-2.5 border-b-2 border-transparent text-slate-500 hover:text-slate-300 flex items-center justify-center space-x-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
          </svg>
          <span>タスク項目</span>
        </button>
      </div>

      <!-- モーダル本体 -->
      <div class="p-4 overflow-y-auto flex-1">

        <!-- タブ1: 通知設定パネル -->
        <div id="settingsPanelNotify" class="space-y-4">
          <div class="flex items-center justify-between p-3 bg-slate-950 rounded-xl border border-slate-800">
            <div>
              <div class="text-xs font-bold text-slate-100">LINE定時通知</div>
              <div class="text-[11px] text-slate-400 mt-0.5">指定時刻きっかりにリマインダーを送信</div>
            </div>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" id="notifyEnabled" class="sr-only peer" onchange="updateNotifyPreview()">
              <div class="w-9 h-5 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-slate-950 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-slate-300 peer-checked:after:bg-slate-950 after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-slate-100"></div>
            </label>
          </div>

          <div id="notifyDetailControls" class="space-y-4 transition-opacity">
            <div>
              <label class="block text-xs font-bold text-slate-300 mb-1.5">配信頻度</label>
              <div class="grid grid-cols-2 gap-1.5 text-xs">
                <button type="button" data-freq="daily" onclick="selectNotifyFreq('daily')" class="n-freq-btn py-2 px-3 rounded-lg border font-medium text-left transition-all">
                  毎日
                </button>
                <button type="button" data-freq="weekdays" onclick="selectNotifyFreq('weekdays')" class="n-freq-btn py-2 px-3 rounded-lg border font-medium text-left transition-all">
                  平日のみ（月〜金）
                </button>
                <button type="button" data-freq="every_2_days" onclick="selectNotifyFreq('every_2_days')" class="n-freq-btn py-2 px-3 rounded-lg border font-medium text-left transition-all">
                  隔日（2日おき）
                </button>
                <button type="button" data-freq="weekly_mon" onclick="selectNotifyFreq('weekly_mon')" class="n-freq-btn py-2 px-3 rounded-lg border font-medium text-left transition-all">
                  週1回（毎週月曜）
                </button>
              </div>
            </div>

            <div>
              <div class="flex items-center justify-between mb-1.5">
                <label class="text-xs font-bold text-slate-300">通知時刻（指定時刻きっかり）</label>
                <span class="text-[10px] font-mono text-slate-500">JST / 1分単位精度</span>
              </div>
              <div class="grid grid-cols-2 gap-2">

  </div>

  <script>
    const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycby3qmDEvkXcEFCTtmLjyWNVuO3j-BhD9DmIW2E680l4CZosTQMianATfxUI2A4ldQ0Xew/exec";

    // ダークモード専用カラーパレット
    const COLOR_THEMES = {
      blue: {
        name: "ブルー",
        swatch: "bg-blue-500",
        cardBg: "bg-blue-950/35 border-blue-800/60",
        accentBar: "bg-blue-500",
        badge: "bg-blue-950 text-blue-300 border border-blue-800/70",
        btnActive: "bg-blue-600 text-white border-blue-500"
      },
      emerald: {
        name: "エメラルド",
        swatch: "bg-emerald-500",
        cardBg: "bg-emerald-950/35 border-emerald-800/60",
        accentBar: "bg-emerald-500",
        badge: "bg-emerald-950 text-emerald-300 border border-emerald-800/70",
        btnActive: "bg-emerald-600 text-white border-emerald-500"
      },
      amber: {
        name: "アンバー",
        swatch: "bg-amber-500",
        cardBg: "bg-amber-950/35 border-amber-800/60",
        accentBar: "bg-amber-500",
        badge: "bg-amber-950 text-amber-300 border border-amber-800/70",
        btnActive: "bg-amber-600 text-white border-amber-500"
      },
      indigo: {
        name: "インディゴ",
        swatch: "bg-indigo-500",
        cardBg: "bg-indigo-950/35 border-indigo-800/60",
        accentBar: "bg-indigo-500",
        badge: "bg-indigo-950 text-indigo-300 border border-indigo-800/70",
        btnActive: "bg-indigo-600 text-white border-indigo-500"
      },
      rose: {
        name: "ローズ",
        swatch: "bg-rose-500",
        cardBg: "bg-rose-950/35 border-rose-800/60",
        accentBar: "bg-rose-500",
        badge: "bg-rose-950 text-rose-300 border border-rose-800/70",
        btnActive: "bg-rose-600 text-white border-rose-500"
      },
      slate: {
        name: "スレート",
        swatch: "bg-slate-400",
        cardBg: "bg-slate-900/90 border-slate-700/80",
        accentBar: "bg-slate-400",
        badge: "bg-slate-800 text-slate-300 border border-slate-700",
        btnActive: "bg-slate-600 text-white border-slate-500"
      }
    };

    const REPEAT_LABELS = {
      none: '',
      daily: '毎日',
      weekly: '毎週',
      monthly: '毎月'
    };

    const DEFAULT_CATEGORIES = [
      { id: "work_task", label: "仕事タスク", color: "blue" },
      { id: "life_task", label: "生活タスク", color: "emerald" },
      { id: "work_knowledge", label: "仕事ナレッジ", color: "indigo" },
      { id: "home_knowledge", label: "家庭ナレッジ", color: "amber" },
      { id: "yomoyama", label: "よもやま", color: "slate" }
    ];

    let categories = JSON.parse(localStorage.getItem('taskflow_categories_v3') || 'null');
    if (!Array.isArray(categories) || categories.length === 0) {
      categories = JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
      localStorage.setItem('taskflow_categories_v3', JSON.stringify(categories));
    }

    const DEFAULT_NOTIFY_SETTINGS = {
      enabled: true,
      frequency: 'daily',
      hour: 7,
      minute: 0,
      scope: 'today_tomorrow'
    };

    let notifySettings = Object.assign(
      {},
      DEFAULT_NOTIFY_SETTINGS,
      JSON.parse(localStorage.getItem('taskflow_notify_v3') || '{}')
    );

    function saveCategories() {
      localStorage.setItem('taskflow_categories_v3', JSON.stringify(categories));
      if (!categories.some(c => c.id === selectedQuickCat)) selectedQuickCat = categories[0].id;
      if (filterCat !== 'all' && !categories.some(c => c.id === filterCat)) filterCat = 'all';
      renderCategoryControls();
      renderSettingsCategoryList();
      renderAll();
    }

    function getCategoryInfo(catId) {
      const found = categories.find(c => c.id === catId);
      if (found) return { label: found.label, theme: COLOR_THEMES[found.color] || COLOR_THEMES.slate };
      return { label: catId || "未分類", theme: COLOR_THEMES.slate };
    }

    let tasks = JSON.parse(localStorage.getItem('taskflow_tasks') || '[]');
    if (tasks.length === 0) {
      const today = getDateOffsetString(0);
      const tomorrow = getDateOffsetString(1);
      const day3 = getDateOffsetString(3);
      tasks = [
        {
          id: 't1',
          title: '週次定例のアジェンダ作成',
          category: 'work_task',
          dueDate: today,
          completed: false,
          createdAt: today,
          repeat: 'weekly',
          memo: '進捗サマリー・課題・来週の優先事項の3点に絞って整理する',
          url: ''
        },
        {
          id: 't2',
          title: '洗剤とキッチンペーパー購入',
          category: 'life_task',
          dueDate: today,
          completed: false,
          createdAt: today,
          repeat: 'none',
          memo: '',
          url: ''
        },
        {
          id: 't3',
          title: 'GASとLINE連携の仕様メモ',
          category: 'work_knowledge',
          dueDate: tomorrow,
          completed: false,
          createdAt: today,
          repeat: 'none',
          memo: 'ScriptApp.newTrigger().timeBased().at() で分単位の時刻指定が可能',
          url: 'https://developers.google.com/apps-script/reference/script/clock-trigger-builder'
        },
        {
          id: 't4',
          title: 'エアコンフィルターの清掃',
          category: 'home_knowledge',
          dueDate: day3,
          completed: false,
          createdAt: today,
          repeat: 'monthly',
          memo: '毎月1回、掃除機でホコリを吸ってから水洗いして陰干しする',
          url: ''
        }
      ];
      localStorage.setItem('taskflow_tasks', JSON.stringify(tasks));
    }

    let currentPage = 0;
    let selectedQuickCat = categories[0].id;
    let selectedQuickRepeat = 'none';
    let selectedNewCatColor = 'blue';
    let filterDate = 'all';
    let filterCat = 'all';
    let searchKeyword = '';
    let expandedTaskIds = new Set();
    let syncTimeout = null;

    function getDateOffsetString(offsetDays) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function calculateNextDueDate(baseDateStr, repeatType) {
      const base = baseDateStr ? new Date(baseDateStr + 'T00:00:00') : new Date();
      if (repeatType === 'daily') {
        base.setDate(base.getDate() + 1);
      } else if (repeatType === 'weekly') {
        base.setDate(base.getDate() + 7);
      } else if (repeatType === 'monthly') {
        base.setMonth(base.getMonth() + 1);
      }
      return `${base.getFullYear()}-${String(base.getMonth() + 1).padStart(2, '0')}-${String(base.getDate()).padStart(2, '0')}`;
    }

    function formatShortDate(dateStr) {
      if (!dateStr) return '期限なし';
      const today = getDateOffsetString(0);
      const tomorrow = getDateOffsetString(1);
      if (dateStr < today) return '期限超過';
      if (dateStr === today) return '本日';
      if (dateStr === tomorrow) return '明日';
      const parts = dateStr.split('-');
      return `${Number(parts[1])}/${Number(parts[2])}`;
    }

    window.switchPage = function(pageIndex) {
      currentPage = pageIndex;
      const wrapper = document.getElementById('swipeWrapper');
      const indicator = document.getElementById('tabIndicator');
      const btn0 = document.getElementById('tabBtn0');
      const btn1 = document.getElementById('tabBtn1');

      wrapper.style.transform = `translateX(-${pageIndex * 100}vw)`;
      indicator.style.transform = `translateX(${pageIndex * 100}%)`;

      if (pageIndex === 0) {
        btn0.classList.replace('text-slate-500', 'text-slate-100');
        btn1.classList.replace('text-slate-100', 'text-slate-500');
      } else {
        btn1.classList.replace('text-slate-500', 'text-slate-100');
        btn0.classList.replace('text-slate-100', 'text-slate-500');
      }
    };

    let touchStartX = 0;
    let touchStartY = 0;
    document.addEventListener('touchstart', e => {
      if (!document.getElementById('settingsModal').classList.contains('hidden')) return;
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    document.addEventListener('touchend', e => {
      if (!document.getElementById('settingsModal').classList.contains('hidden')) return;
      const dx = e.changedTouches[0].screenX - touchStartX;
      const dy = e.changedTouches[0].screenY - touchStartY;
      if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) {
        if (dx < 0 && currentPage === 0) switchPage(1);
        if (dx > 0 && currentPage === 1) switchPage(0);
      }
    }, { passive: true });

    function renderCategoryControls() {
      const quickGroup = document.getElementById('quickCatGroup');
      quickGroup.innerHTML = categories.map(cat => {
        const isSelected = cat.id === selectedQuickCat;
        const theme = COLOR_THEMES[cat.color] || COLOR_THEMES.slate;
        const btnClass = isSelected
          ? `px-3 py-1.5 rounded-md font-semibold border transition-all ${theme.btnActive}`
          : `px-3 py-1.5 rounded-md font-medium bg-slate-800/80 text-slate-300 border border-slate-700/80 hover:bg-slate-800 transition-all`;
        return `<button type="button" onclick="selectQuickCategory('${cat.id}')" class="${btnClass}">${escapeHtml(cat.label)}</button>`;
      }).join('');

      const filterGroup = document.getElementById('filterCatGroup');
      const allActive = filterCat === 'all';
      let filterHtml = `
        <button onclick="selectFilterCategory('all')" class="px-2.5 py-1 rounded-md shrink-0 ${allActive ? 'font-semibold bg-slate-200 text-slate-950' : 'font-medium bg-slate-800 text-slate-400'}">
          全カテゴリ
        </button>
      `;
      filterHtml += categories.map(cat => {
        const active = filterCat === cat.id;
        return `
          <button onclick="selectFilterCategory('${cat.id}')" class="px-2.5 py-1 rounded-md shrink-0 ${active ? 'font-semibold bg-slate-200 text-slate-950' : 'font-medium bg-slate-800 text-slate-400'}">
            ${escapeHtml(cat.label)}
          </button>
        `;
      }).join('');
      filterGroup.innerHTML = filterHtml;
    }

    window.selectQuickCategory = function(catId) {
      selectedQuickCat = catId;
      renderCategoryControls();
    };

    window.selectQuickRepeat = function(rep) {
      selectedQuickRepeat = rep;
      document.querySelectorAll('.q-rep-btn').forEach(btn => {
        if (btn.dataset.repeat === rep) {
          btn.className = 'q-rep-btn py-1.5 rounded-md font-semibold bg-slate-100 text-slate-950 border border-slate-100 transition-all';
        } else {
          btn.className = 'q-rep-btn py-1.5 rounded-md font-medium bg-slate-800/80 text-slate-400 border border-slate-700/80 hover:text-slate-200 transition-all';
        }
      });
    };

    window.toggleQuickDetails = function() {
      const panel = document.getElementById('quickDetailsPanel');
      const icon = document.getElementById('toggleDetailsIcon');
      const isHidden = panel.classList.contains('hidden');
      if (isHidden) {
        panel.classList.remove('hidden');
        icon.style.transform = 'rotate(180deg)';
      } else {
        panel.classList.add('hidden');
        icon.style.transform = 'rotate(0deg)';
      }
    };

    window.selectFilterCategory = function(catId) {
      filterCat = catId;
      renderCategoryControls();
      renderFullList();
    };

    window.handleSearchInput = function() {
      const input = document.getElementById('searchKeywordInput');
      const clearBtn = document.getElementById('clearSearchBtn');
      searchKeyword = input.value.trim().toLowerCase();
      if (searchKeyword.length > 0) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
      renderFullList();
    };

    window.clearSearchKeyword = function() {
      const input = document.getElementById('searchKeywordInput');
      input.value = '';
      handleSearchInput();
    };

    window.toggleTaskExpand = function(taskId) {
      if (expandedTaskIds.has(taskId)) {
        expandedTaskIds.delete(taskId);
      } else {
        expandedTaskIds.add(taskId);
      }
      renderFullList();
    };

    // 設定モーダル
    function initNotifyHourOptions() {
      const hourSelect = document.getElementById('notifyHour');
      let options = '';
      for (let h = 0; h < 24; h++) {
        options += `<option value="${h}">${String(h).padStart(2, '0')}時</option>`;
      }
      hourSelect.innerHTML = options;
    }

    window.openSettingsModal = function(tabName = 'notify') {
      initNotifyHourOptions();
      document.getElementById('notifyEnabled').checked = notifySettings.enabled;
      document.getElementById('notifyHour').value = String(notifySettings.hour);
      document.getElementById('notifyMinute').value = String(notifySettings.minute || 0);
      document.getElementById('notifyScope').value = notifySettings.scope;
      selectNotifyFreq(notifySettings.frequency, false);

      renderColorPicker();
      renderSettingsCategoryList();
      switchSettingsTab(tabName);

      const modal = document.getElementById('settingsModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    };

    window.closeSettingsModal = function() {
      const modal = document.getElementById('settingsModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    };

    window.switchSettingsTab = function(tabName) {
      const tabNotify = document.getElementById('setTabNotify');
      const tabCat = document.getElementById('setTabCategories');
      const panelNotify = document.getElementById('settingsPanelNotify');
      const panelCat = document.getElementById('settingsPanelCategories');

      if (tabName === 'notify') {
        tabNotify.className = 'py-2.5 border-b-2 border-slate-100 text-slate-100 flex items-center justify-center space-x-1.5';
        tabCat.className = 'py-2.5 border-b-2 border-transparent text-slate-500 hover:text-slate-300 flex items-center justify-center space-x-1.5';
        panelNotify.classList.remove('hidden');
        panelCat.classList.add('hidden');
      } else {
        tabCat.className = 'py-2.5 border-b-2 border-slate-100 text-slate-100 flex items-center justify-center space-x-1.5';
        tabNotify.className = 'py-2.5 border-b-2 border-transparent text-slate-500 hover:text-slate-300 flex items-center justify-center space-x-1.5';
        panelCat.classList.remove('hidden');
        panelNotify.classList.add('hidden');
      }
    };

    let tempNotifyFreq = notifySettings.frequency;

    window.selectNotifyFreq = function(freq, triggerPreview = true) {
      tempNotifyFreq = freq;
      document.querySelectorAll('.n-freq-btn').forEach(btn => {
        if (btn.dataset.freq === freq) {
          btn.className = 'n-freq-btn py-2 px-3 rounded-lg border border-slate-100 bg-slate-100 text-slate-950 font-bold text-left transition-all';
        } else {
          btn.className = 'n-freq-btn py-2 px-3 rounded-lg border border-slate-800 bg-slate-950 text-slate-300 font-medium text-left hover:bg-slate-800 transition-all';
        }
      });
      if (triggerPreview) updateNotifyPreview();
    };

    window.updateNotifyPreview = function() {
      const enabled = document.getElementById('notifyEnabled').checked;
      const detailBox = document.getElementById('notifyDetailControls');
      const summaryEl = document.getElementById('notifySummaryText');

      if (!enabled) {
        detailBox.classList.add('opacity-40', 'pointer-events-none');
        summaryEl.textContent = 'LINE定時通知は現在オフになっています';
        return;
      }

      detailBox.classList.remove('opacity-40', 'pointer-events-none');
      const hour = String(document.getElementById('notifyHour').value).padStart(2, '0');
      const minute = String(document.getElementById('notifyMinute').value).padStart(2, '0');
      const scope = document.getElementById('notifyScope').value;

      const freqMap = {
        daily: '毎日',
        weekdays: '平日のみ（月〜金）',
        every_2_days: '隔日（2日おき）',
        weekly_mon: '毎週月曜日'
      };
      const scopeMap = {
        today_only: '今日が期日のタスク',
        today_tomorrow: '今日・明日が期日のタスク',
        all_active: '未完了のすべてのタスク'
      };

      summaryEl.textContent = `${freqMap[tempNotifyFreq]} ${hour}:${minute} きっかりに「${scopeMap[scope]}」をLINEへ送信`;
    };

    window.saveNotificationSettings = function() {
      notifySettings = {
        enabled: document.getElementById('notifyEnabled').checked,
        frequency: tempNotifyFreq,
        hour: Number(document.getElementById('notifyHour').value),
        minute: Number(document.getElementById('notifyMinute').value),
        scope: document.getElementById('notifyScope').value
      };
      localStorage.setItem('taskflow_notify_v3', JSON.stringify(notifySettings));
      closeSettingsModal();
      saveAndSync('通知設定を保存・同期しました');
    };

    function renderColorPicker() {
      const container = document.getElementById('colorPickerGroup');
      container.innerHTML = Object.keys(COLOR_THEMES).map(key => {
        const theme = COLOR_THEMES[key];
        const isSelected = key === selectedNewCatColor;
        return `
          <button
            type="button"
            onclick="selectNewCatColor('${key}')"
            title="${theme.name}"
            class="w-5 h-5 rounded-full ${theme.swatch} ${isSelected ? 'ring-2 ring-offset-2 ring-offset-slate-950 ring-slate-100 scale-110' : 'opacity-65 hover:opacity-100'} transition-all"
          ></button>
        `;
      }).join('');
    }

    window.selectNewCatColor = function(colorKey) {
      selectedNewCatColor = colorKey;
      renderColorPicker();
    };

    function renderSettingsCategoryList() {
      const list = document.getElementById('settingsCategoryList');
      list.innerHTML = categories.map(cat => {
        const theme = COLOR_THEMES[cat.color] || COLOR_THEMES.slate;
        const canDelete = categories.length > 1;
        return `
          <div class="flex items-center justify-between px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg">
            <div class="flex items-center space-x-2.5">
              <span class="w-2.5 h-2.5 rounded-full ${theme.swatch}"></span>
              <span class="text-xs font-semibold text-slate-200">${escapeHtml(cat.label)}</span>
            </div>
            ${canDelete ? `
              <button
                type="button"
                onclick="deleteCategory('${cat.id}')"
                class="text-slate-400 hover:text-rose-400 p-1 rounded transition-colors flex items-center space-x-1 text-[11px]"
              >
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
                <span>削除</span>
              </button>
            ` : `<span class="text-[10px] text-slate-500">必須</span>`}
          </div>
        `;
      }).join('');
    }

    document.getElementById('addCategoryForm').addEventListener('submit', e => {
      e.preventDefault();
      const input = document.getElementById('newCatLabel');
      const label = input.value.trim();
      if (!label) return;
      if (categories.some(c => c.label === label)) {
        showToast('同じ名前の項目が既にあります');
        return;
      }
      categories.push({ id: 'cat_' + Date.now(), label: label, color: selectedNewCatColor });
      input.value = '';
      saveCategories();
      showToast('タスク項目を追加しました');
    });

    window.deleteCategory = function(catId) {
      if (categories.length <= 1) return;
      categories = categories.filter(c => c.id !== catId);
      const fallbackId = categories[0].id;
      tasks.forEach(t => { if (t.category === catId) t.category = fallbackId; });
      saveCategories();
      saveAndSync('タスク項目を削除しました');
    };

    window.resetDefaultCategories = function() {
      categories = JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
      saveCategories();
      showToast('項目を初期設定に戻しました');
    };

    // 優先度ソート（終了日が近い順 かつ 作成日が新しい順）
    function getTop8PriorityTasks() {
      const active = tasks.filter(t => !t.completed);
      return active.sort((a, b) => {
        const dueA = a.dueDate || '9999-12-31';
        const dueB = b.dueDate || '9999-12-31';
        if (dueA !== dueB) return dueA.localeCompare(dueB);
        return (b.id || '').localeCompare(a.id || '');
      }).slice(0, 8);
    }

    function renderPriorityGrid() {
      const grid = document.getElementById('priorityGrid');
      const top8 = getTop8PriorityTasks();
      const today = getDateOffsetString(0);
      let html = '';

      for (let i = 0; i < 8; i++) {
        const task = top8[i];
        if (task) {
          const catInfo = getCategoryInfo(task.category);
          const style = catInfo.theme;
          const dateLabel = formatShortDate(task.dueDate);
          const isUrgent = task.dueDate && task.dueDate <= today;
          const hasRepeat = task.repeat && task.repeat !== 'none';
          const hasDetails = (task.memo && task.memo.trim()) || (task.url && task.url.trim());

          html += `
            <div class="relative overflow-hidden flex items-center justify-between px-2.5 py-1.5 rounded-lg border ${style.cardBg} transition-all">
              <div class="absolute left-0 top-0 bottom-0 w-1 ${style.accentBar}"></div>
              <div class="min-w-0 flex-1 pl-1 pr-1.5">
                <div class="text-xs font-semibold text-slate-100 truncate leading-snug">${escapeHtml(task.title)}</div>
                <div class="flex items-center space-x-1 mt-0.5">
                  <span class="text-[9px] font-bold px-1.5 py-0.2 rounded ${isUrgent ? 'bg-rose-600 text-white' : style.badge}">
                    ${dateLabel}
                  </span>
                  <span class="text-[9px] text-slate-400 truncate">${escapeHtml(catInfo.label)}</span>
                  ${hasRepeat ? `
                    <svg class="w-2.5 h-2.5 text-slate-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24" title="ルーティン">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                  ` : ''}
                  ${hasDetails ? `
                    <svg class="w-2.5 h-2.5 text-slate-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24" title="メモ・リンクあり">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                  ` : ''}
                </div>
              </div>
              <button
                onclick="toggleComplete('${task.id}')"
                title="完了にする"
                class="w-6 h-6 rounded border border-slate-600 bg-slate-900/90 hover:border-slate-100 hover:bg-slate-100 hover:text-slate-950 text-slate-400 flex items-center justify-center shrink-0 transition-colors"
              >
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>
              </button>
            </div>
          `;
        } else {
          html += `
            <div class="flex items-center justify-center rounded-lg border border-dashed border-slate-800 bg-slate-900/30 text-[10px] text-slate-700 font-mono">
              EMPTY
            </div>
          `;
        }
      }
      grid.innerHTML = html;
    }

    function renderFullList() {
      const listEl = document.getElementById('fullTaskList');
      const showCompleted = document.getElementById('showCompletedCheck').checked;
      const today = getDateOffsetString(0);
      const tomorrow = getDateOffsetString(1);

      const filtered = tasks.filter(t => {
        if (!showCompleted && t.completed) return false;
        if (filterCat !== 'all' && t.category !== filterCat) return false;

        // キーワード横断検索（タイトル・詳細メモ・URL・カテゴリ名）
        if (searchKeyword) {
          const catLabel = getCategoryInfo(t.category).label.toLowerCase();
          const titleMatch = (t.title || '').toLowerCase().includes(searchKeyword);
          const memoMatch = (t.memo || '').toLowerCase().includes(searchKeyword);
          const urlMatch = (t.url || '').toLowerCase().includes(searchKeyword);
          const catMatch = catLabel.includes(searchKeyword);
          if (!titleMatch && !memoMatch && !urlMatch && !catMatch) return false;
        }

        if (filterDate === 'today') return t.dueDate === today;
        if (filterDate === 'tomorrow') return t.dueDate === tomorrow;
        if (filterDate === 'week') {
          if (!t.dueDate) return false;
          const target = new Date(t.dueDate);
          const now = new Date();
          now.setHours(0, 0, 0, 0);
          const nextWeek = new Date(now);
          nextWeek.setDate(now.getDate() + 7);
          return target >= now && target <= nextWeek;
        }
        if (filterDate === 'month') {
          return t.dueDate && t.dueDate.slice(0, 7) === today.slice(0, 7);
        }
        return true;
      }).sort((a, b) => {
        if (a.completed !== b.completed) return a.completed ? 1 : -1;
        return (a.dueDate || '9999-12-31').localeCompare(b.dueDate || '9999-12-31');
      });

      document.getElementById('totalBadge').textContent = tasks.filter(t => !t.completed).length;

      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="text-center py-16 text-xs text-slate-500">該当するタスク・ナレッジはありません</div>`;
        return;
      }

      listEl.innerHTML = filtered.map(task => {
        const catInfo = getCategoryInfo(task.category);
        const style = catInfo.theme;
        const hasRepeat = task.repeat && task.repeat !== 'none';
        const hasDetails = (task.memo && task.memo.trim()) || (task.url && task.url.trim());
        const isExpanded = expandedTaskIds.has(task.id);

        return `
          <div class="relative overflow-hidden bg-slate-900 rounded-lg border border-slate-800 shadow-sm ${task.completed ? 'opacity-45' : ''}">
            <div class="absolute left-0 top-0 bottom-0 w-1 ${style.accentBar}"></div>
            <div class="p-3 pl-4 flex items-start justify-between">
              <div class="flex items-start space-x-3 flex-1 min-w-0 pr-2">
                <input
                  type="checkbox"
                  ${task.completed ? 'checked' : ''}
                  onchange="toggleComplete('${task.id}')"
                  class="mt-0.5 w-4 h-4 rounded border-slate-600 bg-slate-800 text-slate-100 focus:ring-slate-400 cursor-pointer"
                >
                <div class="min-w-0 flex-1">
                  <div class="text-sm font-medium ${task.completed ? 'line-through text-slate-500' : 'text-slate-100'} break-words">
                    ${escapeHtml(task.title)}
                  </div>

                  <div class="flex flex-wrap items-center gap-1.5 mt-1.5 text-[10px]">
                    <span class="px-1.5 py-0.5 rounded font-semibold ${style.badge}">${escapeHtml(catInfo.label)}</span>
                    ${task.dueDate ? `<span class="text-slate-400 font-mono">期日: ${task.dueDate}</span>` : ''}
                    ${hasRepeat ? `
                      <span class="inline-flex items-center space-x-1 px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700 font-medium">
                        <svg class="w-2.5 h-2.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                        </svg>
                        <span>${REPEAT_LABELS[task.repeat]}</span>
                      </span>
                    ` : ''}
                    ${hasDetails ? `
                      <button
                        type="button"
                        onclick="toggleTaskExpand('${task.id}')"
                        class="inline-flex items-center space-x-1 px-1.5 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition-colors"
                      >
                        <svg class="w-2.5 h-2.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                        </svg>
                        <span>${isExpanded ? '詳細を閉じる' : 'メモ・リンクを表示'}</span>
                      </button>
                    ` : ''}
                  </div>

                  <!-- 展開されたメモ・リンク詳細 -->
                  ${hasDetails && isExpanded ? `
                    <div class="mt-2.5 p-2.5 bg-slate-950 rounded-md border border-slate-800 space-y-2 text-xs">
                      ${task.memo ? `<p class="text-slate-300 whitespace-pre-wrap leading-relaxed">${escapeHtml(task.memo)}</p>` : ''}
                      ${task.url ? `
                        <a
                          href="${escapeHtml(task.url)}"
                          target="_blank"
                          rel="noopener noreferrer"
                          class="inline-flex items-center space-x-1.5 text-sky-400 hover:text-sky-300 underline font-mono text-[11px] break-all"
                        >
                          <svg class="w-3 h-3 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                          </svg>
                          <span>${escapeHtml(task.url)}</span>
                        </a>
                      ` : ''}
                    </div>
                  ` : ''}
                </div>
              </div>

              <button onclick="deleteTask('${task.id}')" class="text-slate-500 hover:text-rose-400 p-1 transition-colors shrink-0" title="削除">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderAll() {
      renderPriorityGrid();
      renderFullList();
    }

    function saveAndSync(toastMsg) {
      localStorage.setItem('taskflow_tasks', JSON.stringify(tasks));
      renderAll();
      if (toastMsg) showToast(toastMsg);

      if (syncTimeout) clearTimeout(syncTimeout);
      const dot = document.getElementById('syncDot');
      const txt = document.getElementById('syncText');
      dot.className = 'w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse';
      txt.textContent = '同期中...';

      const payloadTasks = tasks.map(t => ({
        ...t,
        categoryLabel: getCategoryInfo(t.category).label
      }));

      syncTimeout = setTimeout(() => {
        fetch(GAS_WEBAPP_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'syncAll',
            tasks: payloadTasks,
            notificationSettings: notifySettings
          })
        }).then(() => {
          dot.className = 'w-1.5 h-1.5 rounded-full bg-emerald-400';
          txt.textContent = '同期済み';
        }).catch(() => {
          dot.className = 'w-1.5 h-1.5 rounded-full bg-rose-500';
          txt.textContent = '同期エラー';
        });
      }, 600);
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('opacity-0');
      setTimeout(() => el.classList.add('opacity-0'), 1800);
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }

    // 完了切り替え（ルーティンタスクの場合は次回タスクを自動生成）
    window.toggleComplete = function(id) {
      const t = tasks.find(item => item.id === id);
      if (!t) return;

      const becomingCompleted = !t.completed;
      t.completed = becomingCompleted;

      if (becomingCompleted && t.repeat && t.repeat !== 'none') {
        const nextDue = calculateNextDueDate(t.dueDate, t.repeat);
        const nextTask = {
          id: 'task_' + Date.now(),
          title: t.title,
          category: t.category,
          dueDate: nextDue,
          completed: false,
          createdAt: getDateOffsetString(0),
          repeat: t.repeat,
          memo: t.memo || '',
          url: t.url || ''
        };
        tasks.unshift(nextTask);
        saveAndSync(`完了処理＆次回分（${nextDue}）を自動生成しました`);
      } else {
        saveAndSync(becomingCompleted ? 'タスクを完了にしました' : '未完了に戻しました');
      }
    };

    window.deleteTask = function(id) {
      tasks = tasks.filter(item => item.id !== id);
      saveAndSync('タスクを削除しました');
    };

    window.setQuickDate = function(offsetDays) {
      document.getElementById('quickDueDate').value = getDateOffsetString(offsetDays);
    };

    // 新規登録フォーム送信
    document.getElementById('quickForm').addEventListener('submit', e => {
      e.preventDefault();
      const titleInput = document.getElementById('quickTitle');
      const dueInput = document.getElementById('quickDueDate');
      const memoInput = document.getElementById('quickMemo');
      const urlInput = document.getElementById('quickUrl');

      const title = titleInput.value.trim();
      if (!title) return;

      tasks.unshift({
        id: 'task_' + Date.now(),
        title: title,
        category: selectedQuickCat,
        dueDate: dueInput.value || getDateOffsetString(0),
        completed: false,
        createdAt: getDateOffsetString(0),
        repeat: selectedQuickRepeat,
        memo: memoInput.value.trim(),
        url: urlInput.value.trim()
      });

      titleInput.value = '';
      memoInput.value = '';
      urlInput.value = '';
      selectQuickRepeat('none');

      const detailsPanel = document.getElementById('quickDetailsPanel');
      if (!detailsPanel.classList.contains('hidden')) {
        toggleQuickDetails();
      }

      saveAndSync('タスクを登録しました');
    });

    // 期間フィルター制御
    document.querySelectorAll('.f-date-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.f-date-btn').forEach(b => {
          b.className = 'f-date-btn px-3 py-1 rounded-md font-medium bg-slate-800 text-slate-400';
        });
        btn.className = 'f-date-btn px-3 py-1 rounded-md font-semibold bg-slate-100 text-slate-950';
        filterDate = btn.dataset.date;
        renderFullList();
      });
    });

    // LINE共有ボタン（絵文字なしフォーマット）
    document.getElementById('shareLineBtn').addEventListener('click', () => {
      const active = tasks.filter(t => !t.completed);
      if (active.length === 0) {
        showToast('未完了のタスクはありません');
        return;
      }
      let msg = '【TaskFlow 3.1 タスク一覧】\n';
      active.forEach(t => {
        const cat = getCategoryInfo(t.category).label;
        const rep = (t.repeat && t.repeat !== 'none') ? ` [${REPEAT_LABELS[t.repeat]}]` : '';
        msg += `・[${cat}] ${t.title}${t.dueDate ? ` (${t.dueDate})` : ''}${rep}\n`;
      });
      window.open(`https://line.me/R/msg/text/?${encodeURIComponent(msg.trim())}`, '_blank');
    });

    // 初期描画
    document.getElementById('quickDueDate').value = getDateOffsetString(0);
    renderCategoryControls();
    renderAll();
  </script>
</body>
</html>
